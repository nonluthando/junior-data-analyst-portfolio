<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141128"/>
      <stop offset="1" stop-color="#24194A"/>
    </linearGradient>
    <linearGradient id="bar" x1="105" y1="0" x2="1050" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="36" fill="url(#bg)"/>
  <circle cx="1010" cy="115" r="230" fill="#7C3AED" fill-opacity=".18" filter="url(#glow)"/>
  <circle cx="170" cy="670" r="190" fill="#06B6D4" fill-opacity=".12" filter="url(#glow)"/>
  <text x="88" y="92" fill="#D8D4FF" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">E-COMMERCE FUNNEL</text>
  <text x="88" y="150" fill="white" font-family="Arial, sans-serif" font-size="54" font-weight="700">The bottleneck is not checkout.</text>
  <text x="88" y="194" fill="#B8B4CA" font-family="Arial, sans-serif" font-size="25">Nearly 6 in 10 users leave between product view and cart.</text>

  <g font-family="Arial, sans-serif">
    <text x="88" y="286" fill="#E9E7F5" font-size="23" font-weight="700">Home</text>
    <text x="1085" y="286" fill="#E9E7F5" font-size="23" font-weight="700" text-anchor="end">100%</text>
    <rect x="88" y="306" width="1024" height="38" rx="19" fill="#342E50"/>
    <rect x="88" y="306" width="1024" height="38" rx="19" fill="url(#bar)"/>

    <text x="88" y="396" fill="#E9E7F5" font-size="23" font-weight="700">Product</text>
    <text x="1085" y="396" fill="#E9E7F5" font-size="23" font-weight="700" text-anchor="end">79.7%</text>
    <rect x="88" y="416" width="1024" height="38" rx="19" fill="#342E50"/>
    <rect x="88" y="416" width="816" height="38" rx="19" fill="url(#bar)"/>

    <text x="88" y="506" fill="#E9E7F5" font-size="23" font-weight="700">Cart</text>
    <text x="1085" y="506" fill="#FBBF24" font-size="23" font-weight="700" text-anchor="end">31.9%</text>
    <rect x="88" y="526" width="1024" height="38" rx="19" fill="#342E50"/>
    <rect x="88" y="526" width="327" height="38" rx="19" fill="#FBBF24"/>
    <text x="440" y="555" fill="#FDE68A" font-size="21" font-weight="700">59.9% drop-off</text>

    <text x="88" y="616" fill="#E9E7F5" font-size="23" font-weight="700">Checkout</text>
    <text x="1085" y="616" fill="#E9E7F5" font-size="23" font-weight="700" text-anchor="end">22.4%</text>
    <rect x="88" y="636" width="1024" height="38" rx="19" fill="#342E50"/>
    <rect x="88" y="636" width="229" height="38" rx="19" fill="url(#bar)"/>

    <text x="88" y="716" fill="#8B879E" font-size="19">Purchase confirmation: 20.2% overall conversion</text>
  </g>
</svg>
