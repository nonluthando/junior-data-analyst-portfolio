<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Configurable CSV data cleaning pipeline</title>
  <desc id="desc">A flow from raw CSV through validation, profile selection, cleaning operations, an audit log, and clean CSV or Excel output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151126"/>
      <stop offset="1" stop-color="#21143c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d7cff"/>
      <stop offset="1" stop-color="#62d4c8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <circle cx="865" cy="70" r="130" fill="#7450e8" opacity=".13"/>
  <circle cx="95" cy="500" r="160" fill="#41c6b7" opacity=".08"/>
  <text x="64" y="70" fill="#f6f3ff" font-family="Arial, sans-serif" font-size="28" font-weight="700">CSV cleaning workflow</text>
  <text x="64" y="101" fill="#aaa2c2" font-family="Arial, sans-serif" font-size="16">Configurable profiles · reproducible output · audit trail</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(60 170)">
      <rect width="150" height="160" rx="20" fill="#28213e" stroke="#493d69"/>
      <rect x="34" y="28" width="82" height="70" rx="10" fill="#181326" stroke="#9d7cff" stroke-width="2"/>
      <path d="M52 49h46M52 65h46M52 81h30" stroke="#dcd5ef" stroke-width="5" stroke-linecap="round"/>
      <text x="75" y="126" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Raw CSV</text>
      <text x="75" y="148" text-anchor="middle" fill="#aaa2c2" font-size="13">Input dataset</text>
    </g>

    <path d="M225 250h52" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="m269 239 14 11-14 11" fill="none" stroke="#62d4c8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(290 145)">
      <rect width="200" height="210" rx="20" fill="#28213e" stroke="#493d69"/>
      <text x="100" y="40" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Choose profile</text>
      <rect x="22" y="62" width="156" height="55" rx="12" fill="#1b162b" stroke="#9d7cff"/>
      <text x="38" y="86" fill="#dcd5ef" font-size="14" font-weight="700">Standard</text>
      <text x="38" y="105" fill="#9188aa" font-size="12">Median + mode fills</text>
      <rect x="22" y="132" width="156" height="55" rx="12" fill="#1b162b" stroke="#62d4c8"/>
      <text x="38" y="156" fill="#dcd5ef" font-size="14" font-weight="700">Aggressive</text>
      <text x="38" y="175" fill="#9188aa" font-size="12">Zero + N/A fills</text>
    </g>

    <path d="M505 250h52" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="m549 239 14 11-14 11" fill="none" stroke="#62d4c8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(570 125)">
      <rect width="220" height="250" rx="20" fill="#28213e" stroke="#493d69"/>
      <text x="110" y="39" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Cleaning operations</text>
      <g fill="#dcd5ef" font-size="14">
        <circle cx="30" cy="76" r="7" fill="#9d7cff"/><text x="48" y="81">Trim whitespace</text>
        <circle cx="30" cy="112" r="7" fill="#8e8cff"/><text x="48" y="117">Remove duplicates</text>
        <circle cx="30" cy="148" r="7" fill="#75a8eb"/><text x="48" y="153">Handle missing values</text>
        <circle cx="30" cy="184" r="7" fill="#62c7d1"/><text x="48" y="189">Drop empty rows</text>
        <circle cx="30" cy="220" r="7" fill="#62d4c8"/><text x="48" y="225">Record audit log</text>
      </g>
    </g>

    <path d="M805 250h37" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <path d="m834 239 14 11-14 11" fill="none" stroke="#62d4c8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(850 170)">
      <rect width="70" height="160" rx="20" fill="#28213e" stroke="#493d69"/>
      <circle cx="35" cy="42" r="18" fill="url(#accent)"/>
      <path d="m26 42 6 6 12-14" fill="none" stroke="#151126" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="35" y="86" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Clean</text>
      <text x="35" y="107" text-anchor="middle" fill="#aaa2c2" font-size="12">CSV</text>
      <text x="35" y="124" text-anchor="middle" fill="#aaa2c2" font-size="12">+</text>
      <text x="35" y="141" text-anchor="middle" fill="#aaa2c2" font-size="12">Excel</text>
    </g>
  </g>

  <g transform="translate(290 405)" font-family="Arial, sans-serif">
    <rect width="500" height="78" rx="16" fill="#1c172b" stroke="#403555"/>
    <text x="24" y="31" fill="#62d4c8" font-size="13" font-weight="700">AUDIT LOG</text>
    <text x="24" y="55" fill="#c6bfd8" font-size="14">Rows removed · values imputed · columns changed · output paths</text>
  </g>
</svg>
